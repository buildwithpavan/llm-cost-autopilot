services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lca
      POSTGRES_PASSWORD: lca
      POSTGRES_DB: lca
    ports:
      - "5432:5432"
    volumes:
      - lca_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lca -d lca"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://lca:lca@postgres:5432/lca
      PORT: "8080"
      LCA_LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: lca-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  lca_pg_data:
